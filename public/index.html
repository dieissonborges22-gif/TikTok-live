<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok LIVE Interactive</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="scene">
    <div class="status"><span class="dot"></span> PERSONAGEM ONLINE</div>
    <section class="character-wrap">
      <div id="character" class="character" aria-label="Personagem virtual">
        <div class="hair"></div>
        <div class="ears"><i></i><i></i></div>
        <div class="arm arm-left"><i class="hand"></i></div>
        <div class="arm arm-right"><i class="hand"></i></div>
        <div class="legs"><i></i><i></i></div>
        <div class="shoes"><i></i><i></i></div>
        <div class="face">
          <div class="eyebrows"><i></i><i></i></div>
          <div class="eyes"><i></i><i></i></div>
          <div class="cheeks"><i></i><i></i></div>
          <div class="mouth" id="mouth"></div>
        </div>
        <div class="neck"></div>
        <div class="body"><span class="shirt-mark">★</span></div>
      </div>
      <div id="bubble" class="bubble" aria-live="polite">Oi, pessoal! Estou pronto para a nossa live! 👋</div>
    </section>
    <section class="controls">
      <button id="likeBtn">❤️ Testar curtida</button>
      <button id="giftBtn">🎁 Testar presente</button>
      <button id="voiceBtn" class="voice-button" aria-pressed="true">🔊 Voz ativada</button>
    </section>
    <p class="hint">Demonstração: os botões simulam eventos. A voz usa a fala do navegador.</p>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
