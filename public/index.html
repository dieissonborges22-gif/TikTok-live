<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel LIVE Girl — TikTok Interactive</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="scene">
  <header class="status"><span class="dot"></span> PIXEL GIRL ONLINE <span class="live-tag">● LIVE</span></header>
  <section class="stage">
    <div class="floating-heart h1">♥</div><div class="floating-heart h2">♥</div><div class="floating-heart h3">♥</div>
    <div class="character-wrap">
      <div id="character" class="character" aria-label="Avatar feminina gamer">
        <img class="character-art" src="/avatar-girl.svg" alt="Personagem feminina de cabelo roxo, headset de gatinha e roupa gamer neon">
        <div id="mouth" class="mouth"></div>
      </div>
    </div>
    <div id="bubble" class="bubble" aria-live="polite">Oii, chat! Eu sou a Pixel Girl! Vamos deixar essa live incrível? ✨</div>
  </section>
  <section class="controls">
    <button id="likeBtn">💗 Testar curtida</button><button id="giftBtn">🎁 Testar presente</button>
    <button id="voiceBtn" class="voice-button" aria-pressed="true">🔊 Voz ativada</button>
    <label class="voice-picker">Voz da personagem <select id="voiceSelect" aria-label="Selecionar voz feminina"></select></label>
  </section>
  <p id="voiceStatus" class="hint">Avatar feminino ilustrado • Reações de demonstração • Voz em português</p>
</main>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body></html>
