name: Validate Pixel LIVE Studio
on:
  push:
    branches: [main, feature/pixel-live-3d-nextgen]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
      - run: node --check public/app.js
      - run: node --check public/overlay.js
